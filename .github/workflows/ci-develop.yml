name: CI - Development

on:
  push:
    branches:
      - feature/github-actions-test

permissions:
  contents: write
  pull-requests: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validar mensagens dos commits
        uses: wagoid/commitlint-github-action@v5
        with:
          configFile: ./commitlint.config.js
          failOnWarnings: false
          helpMessage: "Utilize o padrão: tipo(escopo): descrição (ex: feat(ui): novo botão)"

      - name: Instalar Dependências
        run: npm ci

      - name: Calcular nova versão Preview
        id: version
        run: |
          git fetch --tags --force --prune

          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1 || echo "v0.0.0")
          CURRENT_VERSION="${LAST_TAG#v}"
          BASE_VERSION=$(echo $CURRENT_VERSION | cut -d'-' -f1)

          BUMP_TYPE=$(npx -p conventional-recommended-bump -p conventional-changelog-angular conventional-recommended-bump -p angular)

          NEW_VERSION=$(npx semver -i $BUMP_TYPE "$BASE_VERSION")

          PREVIEW_VERSION="v${NEW_VERSION}-preview.${{ github.run_number }}"

          echo "Calculado: $PREVIEW_VERSION"
          echo "new_version=$PREVIEW_VERSION" >> $GITHUB_OUTPUT

      - name: Criar Release Preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: "Preview ${{ steps.version.outputs.new_version }}"
          draft: false
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/faculride-back:development-${{ steps.version.outputs.new_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/faculride-back:development-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max