name: CI - Development

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24.14.0'
          cache: 'npm'

      - name: Validar mensagens dos commits
        uses: wagoid/commitlint-github-action@v5
        with:
          configFile: ./commitlint.config.js
          failOnWarnings: false
          helpMessage: "Utilize o padrão: tipo(escopo): descrição (ex: feat(ui): novo botão)"
          continueOnError: true

      - name: Instalar Dependências
        run: npm install --force

      - name: Instalar Semver Global
        run: npm install -g semver

      - name: Calcular nova versão Preview
        id: version
        run: |
          git fetch --tags --force --prune

          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1 || echo "v0.0.0")
          CURRENT_VERSION="${LAST_TAG#v}"

          # Remove sufixos anteriores se existirem para o cálculo da base
          BASE_VERSION=$(echo $CURRENT_VERSION | cut -d'-' -f1)
          NEW_VERSION=$(semver -i patch "$BASE_VERSION")

          # Número do preview
          COUNT=$(git tag --list "v${NEW_VERSION}-preview.*" | wc -l | xargs)
          PREVIEW_VERSION="v${NEW_VERSION}-preview.$((COUNT+1))"

          echo "Calculado: $PREVIEW_VERSION"
          echo "new_version=$PREVIEW_VERSION" >> $GITHUB_OUTPUT

      - name: Criar Release Preview
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: "Preview ${{ steps.version.outputs.new_version }}"
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/faculride-back:development-${{ steps.version.outputs.new_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/faculride-back:development-latest

      - name: Deploy Develop na EC2 Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_BACKEND_USER }}
          key: ${{ secrets.EC2_BACKEND_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/faculride-back:development-latest

            docker stop faculride-back || true
            docker rm faculride-back || true

            docker run -d \
              --name faculride-back \
              --restart unless-stopped \
              --env-file /home/ubuntu/FaculRide-BackEnd/.env \
              -p 3000:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/faculride-back:development-latest