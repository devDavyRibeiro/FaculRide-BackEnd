name: CI - Production

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24.14.0'
          cache: 'npm'

      - name: Validar mensagens dos commits
        uses: wagoid/commitlint-github-action@v5
        with:
          configFile: ./commitlint.config.js
          failOnWarnings: false
          helpMessage: "Utilize o padrão: tipo(escopo): descrição (ex: feat(ui): novo botão)"
          continueOnError: true

      - name: Instalar Dependências
        run: npm install --force
      
      - name: Instalar Semver Global
        run: npm install -g semver
      
      - name: Calcular nova versão
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force --prune

          # Busca apenas tags de produção limpas (ex: v1.2.3), ignorando as de preview da develop
          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v 'preview' | head -n1 || true)
          [ -z "$LAST_TAG" ] && LAST_TAG="v0.0.0"
          echo "Última tag de produção: $LAST_TAG"

          CURRENT_VERSION="${LAST_TAG#v}"
          LOG_RANGE="${LAST_TAG}..HEAD"

          mapfile -t COMMITS < <(git log ${LOG_RANGE} --pretty=format:'%s' || true)

          echo "Commits desde ${LAST_TAG}:"
          printf ' - %s\n' "${COMMITS[@]:-<nenhum>}"

          MAJOR=0; MINOR=0; PATCH=0
          for COMMIT in "${COMMITS[@]:-}"; do
            if [[ "$COMMIT" == *"BREAKING CHANGE"* ]] || [[ "$COMMIT" =~ ^feat!\: ]] || [[ "$COMMIT" =~ \!$ ]]; then
              MAJOR=1
            elif [[ "$COMMIT" =~ ^feat(\(.+\))?\: ]]; then
              MINOR=1
            elif [[ "$COMMIT" =~ ^fix(\(.+\))?\: ]]; then
              PATCH=1
            fi
          done

          NEW_VERSION="$CURRENT_VERSION"
          if [[ $MAJOR -eq 1 ]]; then
            NEW_VERSION=$(semver -i major "$CURRENT_VERSION")
          elif [[ $MINOR -eq 1 ]]; then
            NEW_VERSION=$(semver -i minor "$CURRENT_VERSION")
          elif [[ $PATCH -eq 1 ]]; then
            NEW_VERSION=$(semver -i patch "$CURRENT_VERSION")
          fi

          echo "Versão final: $CURRENT_VERSION -> $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "should_deploy=$([[ $CURRENT_VERSION != $NEW_VERSION ]] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Criar Release e Tag (GitHub)
        if: steps.version.outputs.should_deploy == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: "Release v${{ steps.version.outputs.new_version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Docker Login
        if: steps.version.outputs.should_deploy == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.version.outputs.should_deploy == 'true'
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/faculride-back:production-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/faculride-back:production-${{ steps.version.outputs.new_version }}

      - name: Deploy Production na EC2 Backend
        if: steps.version.outputs.should_deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_BACKEND_USER }}
          key: ${{ secrets.EC2_BACKEND_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/faculride-back:production-latest

            docker stop faculride-back || true
            docker rm faculride-back || true

            docker run -d \
              --name faculride-back \
              --restart unless-stopped \
              --env-file /home/ubuntu/FaculRide-BackEnd/.env \
              -p 3000:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/faculride-back:production-latest

  notify_failure:
    name: Notificar Falha
    needs: pipeline
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Enviar E-mail de Erro
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_HOST }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "🚨 FALHA NO CI/CD: ${{ github.repository }}"
          to: "${{ secrets.TEAM_EMAILS }}"
          from: "GitHub Actions <no-reply@seu-dominio.com>"
          body: |
            O pipeline do projeto ${{ github.repository }} falhou!
            Detalhes:
            - Branch: ${{ github.ref_name }}
            - Autor do Commit: ${{ github.actor }}
            - Workflow: ${{ github.workflow }}
            - Log do Erro: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Verifique o link acima para entender a causa da falha.